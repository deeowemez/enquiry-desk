# Checks that run on every push and pull request. None of them need n8n, the database or a model:
# the live gate (test/score.py + compare.py --check) runs on the Pi against staging, because it calls Bedrock.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exports-and-tests:
    name: Workflow exports and Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the workflow exports (valid, no pinned data, placeholders, synthetic emails, no keys)
        run: python3 test/check_exports.py
      - name: Unit tests (claim checks, link rule matches the workflow, gate, export check)
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --no-banner

  console:
    name: Console typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (fact table logic; the API tests need the database and run on the Pi)
        run: npm run test:unit
      - name: Prompts page matches the workflow
        run: node scripts/extract-prompts.mjs --check
