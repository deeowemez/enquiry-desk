# Staff console. Joins the n8n-stack network to reach Postgres by service name (Postgres is bound to loopback on the host).
# Published on 127.0.0.1 only: Tailscale Serve is the way in, and it supplies the signed-in user's identity headers.
#   cp .env.example .env   # set CONSOLE_DB_PASSWORD (the console_ro role, schema/console_role.sql)
#   docker compose up -d --build
name: enquiry-desk-console
services:
  console:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      CONSOLE_DB_HOST: postgres
      CONSOLE_DB_NAME: n8n
      CONSOLE_DB_USER: console_ro
    mem_limit: 256m
    networks: [n8n]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  n8n:
    name: n8n-stack_default
    external: true
