# Grafana for the Enquiry Desk dashboard. Joins the n8n-stack network to reach Postgres by service name
# (Postgres is bound to loopback on the host). Reads through the read-only grafana_ro role.
#   cp .env.example .env   # set GRAFANA_RO_PASSWORD and GF_SECURITY_ADMIN_PASSWORD
#   docker compose up -d
name: enquiry-desk-dashboard
services:
  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://raspberrypi.tailf7a7bf.ts.net:8443/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 400m
    networks: [n8n]
networks:
  n8n:
    name: n8n-stack_default
    external: true
volumes:
  grafana_data:
